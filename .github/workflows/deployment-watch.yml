name: Deployment Watch

# The judge-facing demo silently fell back to a throwaway SQLite database when
# its managed PostgreSQL provider expired, and nobody noticed until someone
# opened the dashboard. This scheduled probe fails the run when /api/health/
# reports the ephemeral fallback, so the repository surfaces the problem on its
# own.
#
# Manual run: Actions -> Deployment Watch -> Run workflow.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

jobs:
  probe:
    name: Probe live deployment
    # Pin the runner image so this scheduled check does not change OS under us
    # during GitHub's ubuntu-latest migration.
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.10"

      - name: Verify deployment
        run: python scripts/verify_deployment.py
