name: Deployment Watch

# The judge-facing demo silently fell back to a throwaway SQLite database when
# its Supabase project vanished, and nobody noticed until someone opened the
# dashboard. This scheduled probe fails the run when /api/health/ reports the
# ephemeral fallback, so the repository surfaces the problem on its own.
#
# Manual run: Actions -> Deployment Watch -> Run workflow.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

jobs:
  probe:
    name: Probe live deployment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Verify deployment
        run: python scripts/verify_deployment.py