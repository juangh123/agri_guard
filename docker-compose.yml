services:
  db:
    image: postgis/postgis:15-3.3
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=agri_guard_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 12

  web:
    build: .
    command: bash -c "python manage.py migrate && python manage.py seed_demo_data && python -m daphne -b 0.0.0.0 -p 8000 config.asgi:application"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgis://postgres:postgres@db:5432/agri_guard_db
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=${DEBUG:-True}
      - CHANNEL_LAYER_BACKEND=redis
      - CELERY_TASK_ALWAYS_EAGER=False
      - GDAL_LIBRARY_PATH=
      - GEOS_LIBRARY_PATH=

      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"

  celery:
    build: .
    command: celery -A config worker -l info
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgis://postgres:postgres@db:5432/agri_guard_db
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=${DEBUG:-True}
      - CELERY_TASK_ALWAYS_EAGER=False
      - GDAL_LIBRARY_PATH=
      - GEOS_LIBRARY_PATH=

  celery-beat:
    build: .
    command: celery -A config beat -l info
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgis://postgres:postgres@db:5432/agri_guard_db
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=${DEBUG:-True}

      - GDAL_LIBRARY_PATH=
      - GEOS_LIBRARY_PATH=
  frontend:
    image: node:22
    working_dir: /app
    command: sh -c "npm install --force && npm run dev -- --host 0.0.0.0"
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"

volumes:
  postgres_data:


